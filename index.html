<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores SVG icons on the Home Screen and would use a blurry snapshot of the page instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Charts" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Chord Sheet Maker</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('csm-settings') || '{}')
        if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.dataset.theme = saved.theme
        document.documentElement.dataset.accent = saved.accent || 'ink'
        if (saved.textSize) document.documentElement.dataset.size = saved.textSize
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
