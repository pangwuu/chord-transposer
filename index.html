<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Chord Sheet Maker</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('csm-settings') || '{}')
        if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.dataset.theme = saved.theme
        document.documentElement.dataset.accent = saved.accent || 'ink'
        if (saved.textSize) document.documentElement.dataset.size = saved.textSize
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
